# HOLyiot 25025 Beacon V1.0 - board-specific configuration.
#
# Zephyr applies boards/<board>.conf on top of prj.conf automatically. These
# settings were in prj.conf until the nRF54L15 Tag was added as a second
# target; they describe this board's parts only.
#
# Note the "automatically": Zephyr only looks for a board .conf when CONF_FILE
# is left undefined, so an explicit "-DCONF_FILE=prj.conf" skips this file.
# Nothing here may be load-bearing for the build to link - only preferences.
# Anything that must hold regardless lives in the application Kconfig, driven
# by the devicetree (see CONFIG_SMART_TAG_FLASH_JEDEC_ID).
#
# The driver symbols themselves are not listed: SHT4X, LIS2DH, LPS22HB_SPI and
# SPI_NOR are all "default y" with "depends on DT_HAS_<compat>_ENABLED", so the
# devicetree already switches them on. Only the choices the devicetree cannot
# make are here.

# LIS2DH12 tuning.
#
# TRIGGER_NONE is not a preference, it is forced: INT1/INT2 land on P2.00 and
# P2.03, and port P2 on nRF54L15 has no GPIOTE and no SENSE, so those lines
# cannot raise an interrupt. Motion has to be polled on this board. (The
# nRF54L15 Tag does not have this problem - its accelerometer interrupt is on
# P0.03 - which is why that board enables ADXL367 triggers instead.)
CONFIG_LIS2DH_TRIGGER_NONE=y
CONFIG_LIS2DH_ACCEL_RANGE_2G=y
CONFIG_LIS2DH_ODR_RUNTIME=y

# The barometer does NOT use CONFIG_LPS22HH. The fitted part is an LPS22HB
# (WHO_AM_I 0xB1); Zephyr's only SPI-capable driver for this register layout
# is "st,lps22hh", which hard-rejects any WHO_AM_I other than 0xB3 and
# refuses to bind - see README.md. It uses the local drivers/sensor/lps22hb_spi
# driver instead (register-compatible otherwise, accepts either ID), bound to
# the "holyiot,lps22hb" compatible on the same devicetree node.
#
# It is not set explicitly here for the same reason as the others: the local
# driver's Kconfig is "default y" on DT_HAS_HOLYIOT_LPS22HB_ENABLED, so the
# node turns it on. Forcing it from prj.conf was in fact a latent error, since
# that would assert the symbol on a board without the node.

CONFIG_BT_DIS_MANUF="HOLyiot"
CONFIG_BT_DIS_MODEL="HOLyiot 25025"
CONFIG_BT_DIS_HW_REV_STR="1.0"
