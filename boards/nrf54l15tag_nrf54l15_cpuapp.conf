# Nordic nRF54L15 Tag (PCA20072) - board-specific configuration.
#
# Zephyr applies boards/<board>.conf on top of prj.conf automatically, so
# everything here is the part of the build that is true of this board only.
# prj.conf carries what both boards share.
#
# Note the "automatically": Zephyr only looks for a board .conf when CONF_FILE
# is left undefined, so an explicit "-DCONF_FILE=prj.conf" skips this file.
# Nothing here may be load-bearing for the build to link - only preferences.
#
# The driver symbols themselves are not listed. BME680, ADXL367 and BMI270 are
# all "default y" with "depends on DT_HAS_<compat>_ENABLED", so enabling the
# nodes in the board overlay already switches the drivers on. Only the choices
# the devicetree cannot make are here.
#
# The BME688 binds to the "bosch,bme680" driver: the two are register
# compatible, and that driver already exposes SENSOR_CHAN_GAS_RES.

# ADXL367 trigger support. This is the one real difference in kind from the
# HOLyiot board, whose accelerometer interrupts land on a port with no GPIOTE
# and so must stay on CONFIG_LIS2DH_TRIGGER_NONE. Here INT1 is on P0.03, which
# has GPIOTE and pin sense, so the sampling thread can be woken by movement.
CONFIG_ADXL367_TRIGGER_GLOBAL_THREAD=y

# Activity/inactivity detection thresholds, in raw ADXL367 counts. The part
# runs at +/-2 g full scale by default, where 1 count = 0.25 mg, so 250
# counts is about 62 mg of excursion from the reference - enough to ignore
# vibration but catch a package being picked up. Referenced mode compares
# against a captured baseline rather than absolute zero, so a tag that is
# stationary at any orientation settles to inactive.
CONFIG_ADXL367_ACTIVITY_THRESHOLD=250
CONFIG_ADXL367_INACTIVITY_THRESHOLD=150
CONFIG_ADXL367_ACTIVITY_TIME=1
CONFIG_ADXL367_INACTIVITY_TIME=30
CONFIG_ADXL367_REFERENCED_ACTIVITY_DETECTION_MODE=y
CONFIG_ADXL367_REFERENCED_INACTIVITY_DETECTION_MODE=y

# The BMI270 is read only while the tag is moving - see sensor_manager.c. Its
# driver uploads an ~8 KB configuration blob to the part at init.
#
# No external flash on this assembly (BOM U8 = Not Fitted): the logs live in
# internal RRAM instead, so SPI_NOR stays off for want of a devicetree node and
# CONFIG_SMART_TAG_FLASH_JEDEC_ID is n.

CONFIG_BT_DIS_MANUF="Nordic Semiconductor"
CONFIG_BT_DIS_MODEL="nRF54L15 Tag (PCA20072)"
CONFIG_BT_DIS_HW_REV_STR="1.0.0"
