# Hardware validation build - PLAN.md phase 1.
#
#   west build -b <board>/nrf54l15/cpuapp -p always . \
#       -- -DCONF_FILE=prj_validation.conf
#
# A complete configuration in its own right, not a layer on top of prj.conf.
# Peripherals only: no Bluetooth, no Zigbee, no settings, and none of the
# sensor drivers. If something fails here it is hardware, pinctrl or the
# device tree - there is nothing else left to blame.
#
# Board-neutral, and it has to be: setting CONF_FILE explicitly makes Zephyr
# skip boards/<board>.conf entirely (see configuration_files.cmake - the board
# lookup only runs when CONF_FILE is undefined), so the per-board sensor
# Kconfig the application build relies on is NOT applied here. That suits this
# build, which wants no sensor drivers at all, but it does mean nothing in
# this file may assume a particular board's hardware.

CONFIG_SMART_TAG_HW_VALIDATION=y
CONFIG_SMART_TAG_HW_VALIDATION_DESTRUCTIVE=y

# Buses under test.
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y

# Log storage: the partition map plus a real erase/write/verify cycle. This is
# external SPI NOR on the HOLyiot board and internal RRAM on the nRF54L15 Tag,
# whose flash footprint is depopulated - the test goes through the flash_area
# API either way.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Neither SPI_NOR nor the JESD216 ID API is set here, because neither is
# board-neutral. SPI_NOR is "default y if DT_HAS_JEDEC_SPI_NOR_ENABLED", so it
# switches itself on for the HOLyiot board's NOR and stays off on the Tag,
# which has no such node. FLASH_JESD216_API is selected by
# CONFIG_SMART_TAG_HW_VALIDATION in the application Kconfig, under the same
# devicetree condition. Forcing either to y here would warn on the Tag.

# The sensor drivers are deliberately absent. During bring-up a driver that
# refuses to bind reports one error for several possible causes - swapped chip
# select, wrong part fitted, dead bus - whereas a raw WHO_AM_I read on each
# chip select says which. The LPS22HH driver in particular rejects the LPS22HB
# the schematic shows, which would mask a working sensor.
#
# CONFIG_SENSOR is off entirely; hw_validation.c talks to the parts directly.

# The report is the product of this build, so nothing may be dropped.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

# No UART on the product: the console is SEGGER RTT over the debug connector.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_REBOOT=y
