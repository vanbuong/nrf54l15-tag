# Core
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SENSOR=y
# Battery voltage is read on the SAADC's internal VDD channel - see
# src/sensors/sensor_manager.c. Neither board has a divider: on both, the
# coin cell is the SoC supply rail. (NRF_SAADC_AVDD would be the internal
# 0.9 V analog rail, which is not the battery.)
CONFIG_ADC=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Console/logging over RTT - neither product exposes a UART.
#
# CONFIG_CONSOLE is explicit because it is not implied on every board: the
# HOLyiot board's defconfig turns it on, the upstream nrf54l15tag one does
# not, and without it RTT_CONSOLE is silently dropped and the tag boots mute.
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# C printf floating point is useful during sensor bring-up.
CONFIG_CBPRINTF_FP_SUPPORT=y

# Bluetooth LE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SmartTag"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_SETTINGS=y

# The Smart Tag notifications are larger than the 20-byte default ATT payload,
# so negotiate a bigger MTU and matching link-layer packets.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_ATT_PREPARE_COUNT=2

# Log streaming queues several notifications at once.
CONFIG_BT_CONN_TX_MAX=8
CONFIG_BT_BUF_ACL_TX_COUNT=8

# Settings persistence (internal RRAM storage partition)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Both logs use CRC-protected records. Which storage they land on is a board
# property: external SPI NOR on the HOLyiot board, internal RRAM on the
# nRF54L15 Tag, whose flash footprint is depopulated.
CONFIG_CRC=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_REBOOT=y

# Sensor drivers are per-board - see boards/<board>.conf. The two targets
# share no sensors at all:
#
#   holyiot_25025  SHT40 + LIS2DH12 + LPS22HB + BY25Q16 NOR
#   nrf54l15tag    BME688 + ADXL367 + BMI270, logs in internal RRAM
#
# CONFIG_SPI_NOR and CONFIG_FLASH_JESD216_API live there too, since only one
# board has an external flash to identify.

# Standard Device Information Service, per PLAN.md section 8. The manufacturer,
# model and hardware revision strings are per-board.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_SERIAL_NUMBER=y

# Stack sizes. The system workqueue runs the BLE notification and log
# streaming work items, so it needs more than the default.
#
# 3072 wasn't enough: a USAGE FAULT (illegal use of the EPSR, PC=0 - a call
# through a NULL function pointer) was observed on the sysworkq thread with
# r0 pointing inside Bluetooth host's internal gatt_sc struct - its work
# item's handler had been zeroed, consistent with a stack overflow
# corrupting adjacent BSS while GATT DB-hash/settings-restore processing
# and advertising start (CONFIG_SMART_TAG_BLE_ADVERTISE_AT_BOOT) overlapped
# early in boot. Doubled as a first attempt at headroom; revisit with
# CONFIG_INIT_STACKS/a stack-usage check if it recurs.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=2048

# BLE normally only advertises on demand (a button press opens the service
# window - see ble_manager.c and PLAN.md section 11). Enabled here so BLE
# can be verified (e.g. with nRF Connect) without needing to press the
# button each time - it still closes itself after ble_service_window_s as
# usual, same as a real button press would. Comment out before a
# production build, where advertising should stay off the battery budget
# until asked for.
CONFIG_SMART_TAG_BLE_ADVERTISE_AT_BOOT=y

# Power management. PLAN.md section 11 wants this designed in from day one,
# but it is only safe to enable once the sampling and radio duty cycles are
# measured on hardware - see the phase 6 note in README.md.
# CONFIG_PM=y
# CONFIG_PM_DEVICE=y
# CONFIG_PM_DEVICE_RUNTIME=y

# Zigbee.
#
# src/zigbee/zigbee_manager.c compiles to a no-op stub unless
# CONFIG_ZIGBEE_ADD_ON is set, so this build works without the add-on.
#
# To enable Zigbee, add the Nordic Zigbee R23 add-on to the workspace
# (see README.md), then uncomment:
#
# CONFIG_ZIGBEE_ADD_ON=y
# CONFIG_ZIGBEE_APP_UTILS=y
# CONFIG_ZIGBEE_ROLE_END_DEVICE=y
# CONFIG_ZIGBEE_FOTA=y
#
# Note that running BLE and Zigbee at the same time is a multiprotocol
# configuration and needs the MPSL dynamic radio switching support.
