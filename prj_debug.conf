# Bring-up overlay. Not applied unless you ask for it:
#
#   west build -b holyiot_25025/nrf54l15/cpuapp -- -DEXTRA_CONF_FILE=prj_debug.conf
#
# Production prj.conf keeps BLE off until a button press. This file opens
# the real service window once at boot so nRF Connect can find the tag
# without the physical button. The window still closes after
# ble_service_window_s.

CONFIG_SMART_TAG_BLE_ADVERTISE_AT_BOOT=y
CONFIG_LOG_DEFAULT_LEVEL=4
